# Single Postgres container, five logical databases (ADR-0003).
# Boot: podman-compose up -d   (or: docker compose up -d)
name: taskcenter

services:
  rabbitmq:
    image: docker.io/library/rabbitmq:4.2.9-management
    environment:
      RABBITMQ_ERLANG_COOKIE: taskcenter-dev-cookie
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  rabbitmq-data:
